name: oracular CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      # Bundle budget, then the packed tarball itself: exact file list, publint, attw.
      - run: npm run size
      - run: npm run pack:check
      - if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  smoke:
    name: Built output runs (Node ${{ matrix.node }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # No npm install: the library has zero runtime dependencies, and the
      # dev toolchain needs Node 22+. This proves the published output itself
      # runs on Node 18 and 20, resolving 'oracular' through the exports map.
      - run: npm run smoke

  docs:
    name: Docs site builds (dead links fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:build

  changeset:
    name: Changeset present (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails when the PR changes files but adds no changeset. Advisory only: PRs without
      # behaviour changes (docs, CI, tests, refactors) legitimately have none.
      - run: npx changeset status --since=origin/main
