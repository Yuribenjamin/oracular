name: oracular CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      # Bundle budget, then the packed tarball itself: exact file list, publint, attw.
      - run: npm run size
      - run: npm run pack:check
      # @oracular/react: typecheck and tests resolve 'oracular' to src/; build, smoke, size and
      # pack:check resolve it through the workspace link to the dist built above.
      - run: npm run typecheck -w packages/react
      - run: npm test -w packages/react
      - run: npm run build -w packages/react
      - run: npm run smoke -w packages/react
      - run: npm run size -w packages/react
      - run: npm run pack:check -w packages/react
      # The example app type-checks and bundles against both packages' published declarations.
      - run: npm run build -w examples/react-vite
      # The package declares react >=18 and develops on 19, so its tests run on the floor too. This
      # reinstalls React 18 without saving and restores the tree with npm ci afterwards: last.
      - run: npm run test:react18 -w packages/react
      - if: matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  smoke:
    name: Built output runs (Node ${{ matrix.node }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # No npm install: the library has zero runtime dependencies, and the
      # dev toolchain needs Node 22+. This proves the published output itself
      # runs on Node 18 and 20, resolving 'oracular' through the exports map.
      - run: npm run smoke

  docs:
    name: Docs site builds (dead links fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:build

  changeset:
    name: Changeset present (advisory)
    # Not on the version PR: it consumes the changesets, so it can never carry one.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails when the PR changes files but adds no changeset. Advisory only: PRs without
      # behaviour changes (docs, CI, tests, refactors) legitimately have none.
      - run: npx changeset status --since=origin/main
