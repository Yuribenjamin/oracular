name: oracular release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the "Version Packages" branch, tags and GitHub releases
      pull-requests: write # the "Version Packages" pull request
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC, no token) needs npm 11.5.1 or newer; Node 22 bundles npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^12

      - name: Assert npm supports trusted publishing
        run: |
          node -e '
            const [v, min] = [process.argv[1], "11.5.1"];
            const cmp = (a, b) => { const x = a.split(".").map(Number), y = b.split(".").map(Number); for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; };
            if (cmp(v, min) < 0) { console.error(`npm ${v} is older than ${min}`); process.exit(1); }
            console.log(`npm ${v}`);
          ' "$(npm -v)"

      - run: npm ci

      # The rehearsal below only makes sense when a publish would follow: npm refuses even a dry
      # run of a version that is already on the registry ("cannot publish over"), which is the
      # normal state of main between releases.
      - name: Check whether this version is already on npm
        id: registry
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "oracular@$v" version >/dev/null 2>&1; then
            echo "oracular@$v is already on npm: nothing will be published, rehearsal skipped"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "oracular@$v is not on npm yet: rehearsing the publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # npm reads package.json before prepublishOnly builds dist, and warns that the bin at
      # dist/cli.js is missing. Build first so the rehearsal log stays clean.
      - name: Build before the rehearsal
        if: steps.registry.outputs.published == 'false'
        run: npm run build

      # Rehearsal: runs prepublishOnly (npm run check) under the real publish environment, with
      # npm's own flags inherited by every nested npm call exactly as they are during the publish,
      # and prints the full output. A failure stops the job here with its cause in the log; inside
      # `changeset publish` the same failure would only read "command failed: npm run check".
      - name: Rehearse publish
        if: steps.registry.outputs.published == 'false'
        run: npm publish --dry-run --json --access public --tag latest
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # With pending changesets: opens or updates the "Version Packages" PR.
      # Without: runs the publish script. `changeset publish` publishes only versions that are
      # not on the registry yet, with provenance, authenticated through OIDC. No NPM_TOKEN.
      # The PAT (not GITHUB_TOKEN) is what lets the Version Packages PR trigger CI.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
          create-github-releases: true
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.RELEASE_PAT }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
